<html xmlns:th="http://thymeleaf.org">
<head th:replace="layout/layout :: head"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <nav th:replace="layout/layout :: menu"></nav>
    <aside th:replace="layout/layout :: sidebar"></aside>
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6"><h1 class="m-0 text-dark">Orden de Trabajo</h1></div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/ordenes}">Órdenes</a></li>
                            <li class="breadcrumb-item active">Nueva</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-12">
                        <div class="card card-primary">
                            <div class="card-header">
                                <h3 class="card-title" th:text="${titulo}"></h3>
                            </div>
                            <form th:object="${orden}" th:action="@{/saveOrden}" method="post">
                                <div class="card-body">
                                    <div class="form-row">
                                        <!-- Selector de cliente -->
                                        <div class="form-group col-md-6">
                                            <label>Cliente</label>
                                            <select name="cliente.id" class="form-control" id="clienteSelect" required>
                                                <option value="">-- Seleccione un cliente --</option>
                                                <option th:each="c : ${clientes}"
                                                        th:value="${c.id}"
                                                        th:text="${c.nombres + ' ' + c.apellidos + ' - ' + c.telefono}"
                                                        th:selected="${orden.cliente != null and orden.cliente.id == c.id}">
                                                </option>
                                            </select>
                                        </div>

                                        <div class="form-group col-md-3">
                                            <label>Tipo de Orden</label>
                                            <select th:field="*{tipoOrden}" class="form-control">
                                                <option th:each="tipo : ${listatipo}"
                                                        th:value="${tipo.id}"
                                                        th:text="${tipo.descripcion}"></option>
                                            </select>
                                        </div>

                                        <div class="form-group col-md-3">
                                            <label>Técnico Responsable</label>
                                            <select th:field="*{operario}" class="form-control">
                                                <option th:each="tecnico : ${listatecnico}"
                                                        th:value="${tecnico.id}"
                                                        th:text="${tecnico.nombres}"></option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="form-row">
                                        <div class="form-group col-md-3">
                                            <label>Fecha Inicio</label>
                                            <input type="date" th:field="*{fechaInicio}" class="form-control" required>
                                        </div>
                                        <div class="form-group col-md-3">
                                            <label>Fecha Estimada Fin</label>
                                            <input type="date" th:field="*{fechaFin}" class="form-control">
                                        </div>
                                    </div>

                                    <div class="form-row">
                                        <div class="form-group col-md-12">
                                            <label>Descripción del trabajo a realizar</label>
                                            <textarea th:field="*{descripcion}" class="form-control" rows="4"
                                                      placeholder="Describa detalladamente el trabajo a realizar..." required></textarea>
                                        </div>
                                    </div>

                                    <div class="form-row">
                                        <div class="form-group col-md-12">
                                            <label>Observaciones adicionales</label>
                                            <textarea th:field="*{observacion}" class="form-control" rows="2"></textarea>
                                        </div>
                                    </div>
                                </div>

                                <div class="card-footer">
                                    <button class="btn btn-primary" type="submit">
                                        <i class="fas fa-save"></i> Crear Orden
                                    </button>
                                    <a th:href="@{/ordenes}" class="btn btn-secondary ml-2">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <footer th:replace="layout/layout :: footer"></footer>
</div>
</body>
</html>
