<html xmlns:th="http://thymeleaf.org">
<head th:replace="layout/layout :: head"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <nav th:replace="layout/layout :: menu"></nav>
    <aside th:replace="layout/layout :: sidebar"></aside>
    <div class="content-wrapper">
        <div class="content-header">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mx-3" role="alert">
                <strong th:text="${success}"></strong>
                <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
            </div>
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6"><h1 class="m-0 text-dark">Órdenes de Trabajo</h1></div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                            <li class="breadcrumb-item active">Órdenes</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h3 class="card-title">Listado de Órdenes</h3>
                                <a th:href="@{/orden}" class="btn btn-primary btn-sm">
                                    <i class="fas fa-plus"></i> Nueva Orden
                                </a>
                            </div>
                            <div class="card-body">
                                <table id="tablaOrdenes" class="table table-bordered table-striped">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Cliente</th>
                                            <th>Tipo</th>
                                            <th>Descripción</th>
                                            <th>Técnico</th>
                                            <th>Fecha Inicio</th>
                                            <th>Estado</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="orden : ${ordenes}">
                                            <td th:text="${orden.id}"></td>
                                            <td th:text="${orden.cliente != null ? orden.cliente.nombres + ' ' + orden.cliente.apellidos : ''}"></td>
                                            <td th:text="${orden.tipoOrden != null ? orden.tipoOrden.descripcion : ''}"></td>
                                            <td th:text="${orden.descripcion}"></td>
                                            <td th:text="${orden.operario != null ? orden.operario.nombres : ''}"></td>
                                            <td th:text="${#dates.format(orden.fechaInicio, 'dd/MM/yyyy')}"></td>
                                            <td>
                                                <span th:if="${orden.estado != null and orden.estado.name() == 'ABIERTA'}" class="badge badge-warning">ABIERTA</span>
                                                <span th:if="${orden.estado != null and orden.estado.name() == 'CERRADA'}" class="badge badge-success">CERRADA</span>
                                            </td>
                                            <td>
                                                <a th:if="${orden.estado == null or orden.estado.name() == 'ABIERTA'}"
                                                   th:href="@{/orden/cerrar/{id}(id=${orden.id})}"
                                                   class="btn btn-success btn-sm" title="Cerrar Orden">
                                                    <i class="fas fa-check"></i> Cerrar
                                                </a>
                                                <span th:if="${orden.estado != null and orden.estado.name() == 'CERRADA'}"
                                                      class="text-muted small" th:text="${orden.comentarioCierre}"></span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <footer th:replace="layout/layout :: footer"></footer>
</div>
<script src="/plugins/datatables/jquery.dataTables.min.js"></script>
<script src="/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
<script>
    $(function () {
        $("#tablaOrdenes").DataTable({
            "responsive": true, "autoWidth": true,
            "language": {
                "sSearch": "Buscar:", "sLengthMenu": "Mostrar _MENU_ registros",
                "sZeroRecords": "No se encontraron resultados",
                "sInfo": "Mostrando _START_ al _END_ de _TOTAL_ registros",
                "oPaginate": {"sNext": "Siguiente", "sPrevious": "Anterior", "sFirst": "Primero", "sLast": "Último"}
            }
        });
    });
</script>
</body>
</html>
